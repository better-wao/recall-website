<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 260" fill="none" role="img" aria-label="Recall">
  <text
    x="0"
    y="210"
    font-family="Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif"
    font-weight="800"
    font-size="260"
    letter-spacing="-12"
    fill="#FFFFFF"
  >Recall</text>
  <g stroke="#FFFFFF" stroke-width="26" stroke-linecap="square" stroke-linejoin="miter" fill="none">
    <!-- diagonal shaft, bottom-left to top-right -->
    <line x1="900" y1="220" x2="1060" y2="60" />
    <!-- arrowhead: top edge + right edge meeting at the tip -->
    <polyline points="945,60 1060,60 1060,175" />
  </g>
</svg>
